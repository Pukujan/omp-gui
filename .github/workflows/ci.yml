name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install omp (Linux binary)
        run: |
          curl -fsSL https://omp.sh/install | sh -s -- --binary
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: cd server && npm install --omit=dev
      - name: Syntax check
        run: |
          for f in server/index.js server/lib/*.js web/app.js web/js/*.js scripts/smoke.js scripts/test-server.js; do
            node --check "$f"
          done
      - name: Auth + API smoke (no model calls)
        env:
          OMP_GUI_USER: ci
          OMP_GUI_PASS_PLAINTEXT: ci-secret
          OMP_GUI_SESSION_SECRET: ci-tes…cdef
        run: |
          node server/index.js &
          sleep 2
          curl -fsS http://127.0.0.1:8790/api/health
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8790/api/projects)
          test "$code" = 401
          curl -fsS -c /tmp/cj -X POST http://127.0.0.1:8790/api/login \
            -H 'content-type: application/json' \
            -d "{\"username\":\"ci\",\"password\":\"$OMP_GUI_PASS_PLAINTEXT\"}" | grep -q '"ok":true'
          test -s /tmp/cj
          bad=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8790/api/login \
            -H 'content-type: application/json' -d '{"username":"ci","password":"nope-not-it"}')
          test "$bad" = 401
      - name: API + isolation tests (one real agent turn)
        env:
          OMP_GUI_USER: ci
          OMP_GUI_PASS_PLAINTEXT: ci-secret
          OMP_GUI_SESSION_SECRET: ci-test-secret-0123456789abcdef
        run: node scripts/test-server.js
      - name: Docker build
        run: docker build -t omp-gui:ci .
